<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在庫フォーム</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <div th:replace="~{management/fragments :: sidebar}"></div>
    <main class="admin-main">
      <div class="page-head">
        <h1 th:text="${item.id == null ? '在庫登録' : '在庫編集'}"></h1>
        <a class="btn" th:href="@{/management/inventory}">一覧へ戻る</a>
      </div>
      <div th:replace="~{management/fragments :: pageAlert}"></div>

      <form class="panel"
            th:action="${item.id == null} ? @{/management/inventory} : @{/management/inventory/{id}(id=${item.id})}"
            method="post"
            th:object="${item}"
            onsubmit="return confirm('この内容で保存しますか？');">
        <div class="form-grid">
          <label>名称<input th:field="*{itemName}" maxlength="255" required></label>
          <label>英語名<input th:field="*{englishName}" maxlength="255"></label>
          <label>カテゴリ
            <select th:field="*{category}">
              <option value="商品">商品</option>
              <option value="容器">容器</option>
              <option value="原料">原料</option>
            </select>
          </label>
          <label>在庫数<input type="number" step="0.1" th:field="*{stockQuantity}" required></label>
          <label>単位
            <select th:field="*{unit}">
              <option value="ml">ml</option>
              <option value="pcs">pcs</option>
              <option value="g">g</option>
            </select>
          </label>
          <label>しきい値<input type="number" step="0.1" th:field="*{thresholdQuantity}"></label>
          <label>保管場所<input th:field="*{storageLocation}" maxlength="255"></label>
          <label>仕入先<input th:field="*{supplier}" maxlength="255"></label>
          <label>最終入荷日<input type="date" th:field="*{lastReceivedDate}"></label>
          <label class="full">メモ<textarea th:field="*{memo}" maxlength="1000"></textarea></label>
        </div>
        <button class="primary" type="submit">保存</button>
      </form>
    </main>
  </div>
</body>
</html>

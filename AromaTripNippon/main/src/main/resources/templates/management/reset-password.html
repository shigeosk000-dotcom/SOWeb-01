<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新しいパスワード設定</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="admin-body">
  <main class="login">
    <section class="panel">
      <h1>新しいパスワード設定</h1>
      <p class="errors" th:if="${errorMessage}" th:text="${errorMessage}"></p>
      <form th:if="${errorMessage == null}" th:action="@{/management/reset-password}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">
        <label>新しいパスワード<input type="password" name="newPassword" minlength="8" required></label>
        <label>新しいパスワード（確認）<input type="password" name="confirmPassword" minlength="8" required></label>
        <button class="primary" type="submit">パスワードを更新</button>
      </form>
      <p><a th:href="@{/management/login}">ログイン画面へ戻る</a></p>
    </section>
  </main>
</body>
</html>

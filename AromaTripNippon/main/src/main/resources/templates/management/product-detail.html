<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品詳細</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <div th:replace="~{management/fragments :: sidebar}"></div>
    <main class="admin-main">
      <div class="page-head">
        <h1>商品詳細</h1>
        <div class="actions">
          <a class="btn" th:href="@{/management/products}">一覧</a>
          <a class="btn primary" th:href="@{/management/products/{id}/edit(id=${product.id})}">編集</a>
        </div>
      </div>
      <div th:replace="~{management/fragments :: pageAlert}"></div>
      <section class="panel">
        <table class="table">
          <tr><th>ID</th><td th:text="${product.id}"></td></tr>
          <tr><th>商品名</th><td th:text="${product.productName}"></td></tr>
          <tr><th>英語名</th><td th:text="${product.englishName}"></td></tr>
          <tr><th>カテゴリ</th><td th:text="${product.category != null ? product.category.categoryName : ''}"></td></tr>
          <tr><th>価格</th><td th:text="${product.price}"></td></tr>
          <tr><th>公開</th><td th:text="${product.published ? '公開中' : '非公開'}"></td></tr>
          <tr><th>説明</th><td class="note-scroll" th:text="${product.description}"></td></tr>
        </table>
        <form th:action="@{/management/products/{id}/delete(id=${product.id})}" method="post" onsubmit="return confirm('この商品を削除しますか？');">
          <button class="danger">削除実行</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>

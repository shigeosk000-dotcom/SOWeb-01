<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>商品詳細</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-body"><div class="admin-layout"><div th:replace="~{management/fragments :: sidebar}"></div><main class="admin-main"><div class="page-head"><h1>商品詳細</h1><div class="actions"><a class="btn" th:href="@{/management/products}">一覧</a><a class="btn primary" th:href="@{/management/products/{id}/edit(id=${product.id})}">編集</a></div></div>
<section class="panel"><table class="table"><tr><th>ID</th><td th:text="${product.id}"></td></tr><tr><th>商品名</th><td th:text="${product.productName}"></td></tr><tr><th>カテゴリ</th><td th:text="${product.category}"></td></tr><tr><th>価格</th><td th:text="${product.price}"></td></tr><tr><th>在庫品目</th><td th:text="${product.inventoryItem.itemName}"></td></tr><tr><th>画像パス</th><td th:text="${product.imagePath}"></td></tr></table><form th:action="@{/management/products/{id}/delete(id=${product.id})}" method="post"><button class="danger">論理削除</button></form></section>
</main></div></body></html>

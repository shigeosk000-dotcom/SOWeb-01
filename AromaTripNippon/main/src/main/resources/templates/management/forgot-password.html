<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="admin-body">
  <main class="login">
    <section class="panel">
      <h1>パスワード再設定</h1>
      <p class="errors" th:if="${errorMessage}" th:text="${errorMessage}"></p>
      <form th:action="@{/management/forgot-password}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>管理者ID<input name="loginId" required></label>
        <label>認証アプリの6桁コード<input name="totpCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"></label>
        <label>バックアップコード（認証アプリ不可時）<input name="backupCode" maxlength="20"></label>
        <label>新しいパスワード<input type="password" name="newPassword" minlength="8" required></label>
        <label>新しいパスワード（確認）<input type="password" name="confirmPassword" minlength="8" required></label><BR>
        <button class="primary" type="submit">パスワードを再設定</button><BR>
      </form><BR>
      <p><a th:href="@{/management/login}">ログイン画面へ戻る</a></p>
    </section>
  </main>
</body>

</html>

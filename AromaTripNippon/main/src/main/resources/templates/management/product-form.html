<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品フォーム</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <div th:replace="~{management/fragments :: sidebar}"></div>
    <main class="admin-main">
      <div class="page-head">
        <h1 th:text="${product.id == null ? '商品登録' : '商品編集'}"></h1>
        <a class="btn" th:href="@{/management/products}">一覧へ戻る</a>
      </div>
      <div th:replace="~{management/fragments :: pageAlert}"></div>

      <form class="panel"
            th:action="${product.id == null} ? @{/management/products} : @{/management/products/{id}(id=${product.id})}"
            method="post"
            th:object="${product}"
            onsubmit="return confirm('この内容で保存しますか？');">
        <div class="form-grid">
          <label>商品名<input th:field="*{productName}" maxlength="255" required></label>
          <label>英語名<input th:field="*{englishName}" maxlength="255" required></label>
          <label>カテゴリ
            <select name="categoryId" required>
              <option value="">選択してください</option>
              <option th:each="category : ${categories}"
                      th:value="${category.id}"
                      th:selected="${product.category != null and product.category.id == category.id}"
                      th:text="${category.categoryName}"></option>
            </select>
          </label>
          <label>価格<input type="number" step="1" th:field="*{price}" required></label>
          <label>公開<input type="checkbox" th:field="*{published}"></label>
          <label class="full">説明<textarea th:field="*{description}" maxlength="1000"></textarea></label>
        </div>
        <button class="primary" type="submit">保存</button>
      </form>
    </main>
  </div>
</body>
</html>

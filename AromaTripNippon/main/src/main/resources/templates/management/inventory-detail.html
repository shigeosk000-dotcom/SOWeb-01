<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在庫詳細</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <div th:replace="~{management/fragments :: sidebar}"></div>
    <main class="admin-main">
      <div class="page-head">
        <h1>在庫詳細</h1>
        <div class="actions"><a class="btn" th:href="@{/management/inventory}">一覧</a><a class="btn primary" th:href="@{/management/inventory/{id}/edit(id=${item.id})}">編集</a></div>
      </div>
      <div th:replace="~{management/fragments :: pageAlert}"></div>
      <section class="panel">
        <table class="table">
          <tr><th>ID</th><td th:text="${item.id}"></td></tr>
          <tr><th>材料名</th><td th:text="${item.itemName}"></td></tr>
          <tr><th>英語名</th><td th:text="${item.englishName}"></td></tr>
          <tr><th>カテゴリ</th><td th:text="${item.category}"></td></tr>
          <tr><th>在庫数</th><td><span th:text="${item.stockQuantity}"></span> <span th:text="${item.unit}"></span></td></tr>
          <tr><th>しきい値</th><td><span th:text="${item.thresholdQuantity}"></span> <span th:text="${item.unit}"></span></td></tr>
          <tr><th>保管場所</th><td th:text="${item.storageLocation}"></td></tr>
          <tr><th>仕入先</th><td th:text="${item.supplier}"></td></tr>
          <tr><th>最終入荷日</th><td th:text="${item.lastReceivedDate}"></td></tr>
          <tr><th>メモ</th><td th:text="${item.memo}"></td></tr>
        </table>
        <h2>在庫更新</h2>
        <form th:action="@{/management/inventory/{id}/transaction(id=${item.id})}" method="post" class="form-grid" onsubmit="return confirm('この在庫調整を実行しますか？');">
          <label>種別<select name="transactionType"><option value="IN">入庫</option><option value="OUT">出庫</option><option value="ADJUST">調整</option></select></label>
          <label>数量<input name="quantity" type="number" step="0.1" required></label>
          <label class="full">理由<input name="reason" maxlength="1000"></label>
          <button class="primary inventory-transaction-submit">保存</button>
        </form>
        <form th:action="@{/management/inventory/{id}/delete(id=${item.id})}" method="post" onsubmit="return confirm('この在庫を削除しますか？');"><button class="danger">削除実行</button></form>
      </section>
    </main>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント設定</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="admin-body">
    <div class="admin-layout">
        <div th:replace="~{management/fragments :: sidebar}"></div>
        <main class="admin-main">
            <div class="page-head">
                <h1>アカウント設定</h1>
            </div>
            <div th:replace="~{management/fragments :: pageAlert}"></div>
            <p th:if="${successMessage}" th:text="${successMessage}"></p>
            <p th:if="${param.updated}">保存しました。</p>
            <form class="panel" th:action="@{/management/account}" method="post" th:object="${admin}"
                onsubmit="return confirm('アカウント設定を更新しますか？');">
                <div class="form-grid">
                    <label>管理者名<input th:field="*{displayName}" maxlength="255" required></label><label>メール<input
                            type="email" th:field="*{email}" maxlength="255"></label><label>通知設定<select
                            th:field="*{notificationSetting}">
                            <option value="ON">ON</option>
                            <option value="OFF">OFF</option>
                        </select></label><label>表示言語<select th:field="*{displayLanguage}">
                            <option value="日本語">日本語</option>
                            <option value="English">English</option>
                        </select></label><label>新パスワード<input type="password" name="newPassword"
                            minlength="8"></label><BR>
                </div><BR><button class="primary">保存</button>
            </form>
            <section class="panel">
                <h2>TOTP認証</h2>
                <p th:if="${totpEnabled}">状態: 有効</p>
                <p th:unless="${totpEnabled}">状態: 未設定</p>
                <p th:if="${totpSetupInProgress}">認証アプリ（Google
                    Authenticatorなど）でQR読み込み又はシークレットコードを入力し、表示された6桁コードを設定してください。</p>
                <div class="totp-qr-box" th:if="${totpSetupInProgress}">
                    <img class="totp-qr" th:src="@{${totpQrUrl}}" alt="TOTP登録用QRコード">
                </div>
                <p th:if="${totpSetupInProgress}">シークレット: <code th:text="${totpSecret}"></code></p>
                <p th:if="${totpSetupInProgress}">otpauth URI: <code th:text="${totpUri}"></code></p>
                <form th:if="${totpSetupInProgress}" th:action="@{/management/account/totp/enable}" method="post">
                    <label>認証アプリの6桁コード<input name="totpCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                            required></label><BR>
                    <button class="primary" type="submit">TOTPを有効化</button>
                </form><BR>
                <form th:action="@{/management/account/totp/setup}" method="post">
                    <button type="submit">シークレット再生成</button>
                </form><BR>
                <form th:if="${totpEnabled and totpSetupInProgress}" th:action="@{/management/account/totp/cancel}"
                    method="post">
                    <button type="submit">キャンセル</button>
                </form><BR>
                <form th:if="${totpEnabled}" th:action="@{/management/account/totp/backup-codes}" method="post">
                    <button type="submit">バックアップコード再発行</button>
                </form><BR>
                <div th:if="${backupCodes}">
                    <h3>バックアップコード（1回のみ表示）</h3>
                    <p>パスワード紛失時に認証アプリが使用できなかった場合に備え、バックアップコードは必ず控えておき、厳重に保管しておいてください。</p>
                    <ul>
                        <li th:each="code : ${backupCodes}" th:text="${code}"></li>
                    </ul>
                </div>
            </section>
        </main>
    </div>
</body>

</html>

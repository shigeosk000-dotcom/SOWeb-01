<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>アカウント設定</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-body"><div class="admin-layout"><div th:replace="~{management/fragments :: sidebar}"></div><main class="admin-main"><div class="page-head"><h1>アカウント設定</h1></div>
<div th:replace="~{management/fragments :: pageAlert}"></div>
<p th:if="${param.updated}">保存しました。</p>
<form class="panel" th:action="@{/management/account}" method="post" th:object="${admin}" onsubmit="return confirm('アカウント設定を更新しますか？');"><div class="form-grid">
<label>管理者名<input th:field="*{displayName}" maxlength="255" required></label><label>メール<input type="email" th:field="*{email}" maxlength="255"></label><label>通知設定<select th:field="*{notificationSetting}"><option value="ON">ON</option><option value="OFF">OFF</option></select></label><label>表示言語<select th:field="*{displayLanguage}"><option value="日本語">日本語</option><option value="English">English</option></select></label><label>新パスワード<input type="password" name="newPassword" minlength="8"></label></div><button class="primary">保存</button></form>
</main></div></body></html>

<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>予約詳細</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-body"><div class="admin-layout"><div th:replace="~{management/fragments :: sidebar}"></div><main class="admin-main">
<div class="page-head"><h1>予約詳細</h1><div class="actions"><a class="btn" th:href="@{/management/reservations}">一覧</a><a class="btn primary" th:href="@{/management/reservations/{id}/edit(id=${reservation.id})}">編集</a></div></div>
<div th:replace="~{management/fragments :: pageAlert}"></div>
<section class="panel"><table class="table">
<tr><th>ID</th><td th:text="${reservation.id}"></td></tr>
<tr><th>顧客</th><td th:text="${reservation.customer != null ? reservation.customer.name : ''}"></td></tr>
<tr><th>体験</th><td th:text="${reservation.experienceProgram != null ? reservation.experienceProgram.name : ''}"></td></tr>
<tr><th>来店日</th><td th:text="${reservation.visitDate}"></td></tr>
<tr><th>時間帯</th><td th:text="${reservation.timeSlot}"></td></tr>
<tr><th>人数</th><td th:text="${reservation.guestCount}"></td></tr>
<tr><th>状態</th><td th:text="${reservation.status}"></td></tr>
<tr><th>希望言語</th><td th:text="${reservation.preferredLanguage}"></td></tr>
<tr><th>要望</th><td th:text="${reservation.requestNote}"></td></tr>
</table>
<form th:action="@{/management/reservations/{id}/delete(id=${reservation.id})}" method="post" onsubmit="return confirm('この予約を削除しますか？');"><button class="danger" type="submit">論理削除</button></form></section>
</main></div></body></html>

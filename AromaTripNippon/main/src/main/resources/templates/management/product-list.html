<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品管理</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <div th:replace="~{management/fragments :: sidebar}"></div>
    <main class="admin-main">
      <div class="page-head">
        <h1>商品管理</h1>
        <a class="btn primary" th:href="@{/management/products/new}">新規登録</a>
      </div>
      <div th:replace="~{management/fragments :: pageAlert}"></div>
      <form class="panel search-form" th:action="@{/management/products}" method="get">
        <input name="q" th:value="${q}" placeholder="商品名で検索">
        <button class="primary" type="submit">検索</button>
        <a class="btn primary" th:href="@{/management/products}">クリア</a>
      </form>
      <table class="table">
        <tr>
          <th>ID</th>
          <th>商品名</th>
          <th>英語名</th>
          <th>カテゴリ</th>
          <th>価格</th>
          <th>操作</th>
        </tr>
        <tr th:each="p : ${products}">
          <td th:text="${p.id}"></td>
          <td th:text="${p.productName}"></td>
          <td th:text="${p.englishName}"></td>
          <td th:text="${p.category != null ? p.category.categoryName : ''}"></td>
          <td th:text="${p.price}"></td>
          <td>
            <div class="table-actions">
              <a th:href="@{/management/products/{id}(id=${p.id})}">詳細</a>
              <span>/</span>
              <a th:href="@{/management/products/{id}/edit(id=${p.id})}">編集</a>
              <span>/</span>
              <form th:action="@{/management/products/{id}/delete(id=${p.id})}" method="post"
                    onsubmit="return confirm('この商品を削除しますか？');">
                <button class="link-button danger-text" type="submit">削除</button>
              </form>
            </div>
          </td>
        </tr>
      </table>
    </main>
  </div>
</body>
</html>

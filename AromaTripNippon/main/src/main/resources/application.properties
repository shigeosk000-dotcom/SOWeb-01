spring.application.name=AromaTripNippon Phase1
spring.datasource.url=jdbc:h2:file:./data/aromatripnippon;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# 本番リリース時は以下の設定に変更することを推奨
# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
server.port=8080

# Password reset + mail settings (Resend SMTP)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.from=${APP_MAIL_FROM:no-reply@aromatripnippon.local}
spring.mail.host=${SPRING_MAIL_HOST:smtp.resend.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:resend}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

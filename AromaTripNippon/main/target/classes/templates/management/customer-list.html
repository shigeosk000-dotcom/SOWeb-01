<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>顧客管理</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-body"><div class="admin-layout"><div th:replace="~{management/fragments :: sidebar}"></div><main class="admin-main">
<div class="page-head"><h1>顧客管理</h1><a class="btn primary" th:href="@{/management/customers/new}">新規登録</a></div>
<form class="panel" th:action="@{/management/customers}" method="get"><input name="q" th:value="${q}" placeholder="顧客名で検索"></form>
<table class="table"><tr><th>ID</th><th>氏名</th><th>メール</th><th>言語</th><th>操作</th></tr><tr th:each="c : ${customers}"><td th:text="${c.id}"></td><td th:text="${c.name}"></td><td th:text="${c.email}"></td><td th:text="${c.preferredLanguage}"></td><td><a th:href="@{/management/customers/{id}(id=${c.id})}">詳細</a> / <a th:href="@{/management/customers/{id}/edit(id=${c.id})}">編集</a></td></tr></table>
</main></div></body></html>

<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>予約フォーム</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-body"><div class="admin-layout"><div th:replace="~{management/fragments :: sidebar}"></div><main class="admin-main">
<div class="page-head"><h1 th:text="${reservation.id == null ? '予約登録' : '予約編集'}"></h1><a class="btn" th:href="@{/management/reservations}">一覧へ戻る</a></div>
<form class="panel" th:action="${reservation.id == null} ? @{/management/reservations} : @{/management/reservations/{id}(id=${reservation.id})}" method="post" th:object="${reservation}">
<div class="form-grid">
<label>顧客<select name="customerId" required><option th:each="c : ${customers}" th:value="${c.id}" th:selected="${reservation.customer != null and reservation.customer.id == c.id}" th:text="${c.name}"></option></select></label>
<label>体験<select name="programId" required><option th:each="p : ${programs}" th:value="${p.id}" th:selected="${reservation.experienceProgram != null and reservation.experienceProgram.id == p.id}" th:text="${p.name}"></option></select></label>
<label>来店日<input type="date" th:field="*{visitDate}" required></label><label>時間帯<select th:field="*{timeSlot}" required><option value="10:00">10:00</option><option value="13:00">13:00</option><option value="16:00">16:00</option></select></label>
<label>人数<input type="number" th:field="*{guestCount}" min="1" max="4" required></label><label>状況<select th:field="*{status}"><option value="RESERVED">予約済</option><option value="VISITED">来店済</option><option value="CANCELLED">キャンセル</option></select></label>
<label>希望言語<input th:field="*{preferredLanguage}"></label><label class="full">要望<textarea th:field="*{requestNote}"></textarea></label></div><button class="primary" type="submit">保存</button></form>
</main></div></body></html>

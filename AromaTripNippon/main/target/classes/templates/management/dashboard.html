<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダッシュボード</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="admin-body">
<div class="admin-layout">
  <div th:replace="~{management/fragments :: sidebar}"></div>
  <main class="admin-main">
    <div class="page-head"><h1>ダッシュボード</h1></div>
    <div th:replace="~{management/fragments :: pageAlert}"></div>
    <section class="stats">
      <a class="card stat stat-link" th:href="@{/management/reservations}"><span>予約</span><strong th:text="${reservationCount}">0</strong></a>
      <a class="card stat stat-link" th:href="@{/management/customers}"><span>顧客</span><strong th:text="${customerCount}">0</strong></a>
      <a class="card stat stat-link" th:href="@{/management/recipes}"><span>レシピ</span><strong th:text="${recipeCount}">0</strong></a>
      <a class="card stat stat-link" th:href="@{/management/inventory}"><span>在庫</span><strong th:text="${inventoryCount}">0</strong></a>
    </section>
    <section class="panel">
      <h2>最近の監査ログ</h2>
      <table class="table"><tr><th>操作</th><th>対象</th><th>詳細</th></tr>
        <tr th:each="log : ${logs}"><td th:text="${log.actionType}"></td><td th:text="${log.targetTable}"></td><td th:text="${log.detail}"></td></tr>
      </table>
    </section>
  </main>
</div>
</body>
</html>

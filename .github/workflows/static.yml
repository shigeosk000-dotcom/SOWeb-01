name: Deploy AromaTrip

on:
  push:
    branches: ["main"] # ブランチ名が異なる場合はここを修正してください

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 指定された階層を公開ルートに設定
          path: 'AromaTrip/main'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/images/LOGO.png" alt="Aroma Trip Nippon" />
      </a>
      <nav class="nav" aria-label="グローバルナビゲーション">
        <a href="concept.html">コンセプト</a>
        <a href="experience.html">体験詳細</a>
        <a href="reservation.html">予約</a>
      </nav>
      <div class="header-actions">
        <!-- <span class="lang">EN / JP</span> -->
        <a class="btn header-book" href="reservation.html">Book Experience</a>
        <button class="menu-toggle" type="button" aria-label="メニューを開く" aria-controls="mobile-nav" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
      <nav class="mobile-nav" id="mobile-nav" aria-label="モバイルナビゲーション" hidden>
        <a href="concept.html">コンセプト</a>
        <a href="experience.html">体験詳細</a>
        <a href="reservation.html">予約</a>
        <a class="btn" href="reservation.html">Book Experience</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="breadcrumbs"><a href="index.html">トップ</a> / <a href="reservation.html">予約</a> / <span>予約完了</span></div>
    <section class="hero">
      <div class="card complete-card">
        <div class="badge">Reservation Complete</div>
        <h1>ご予約ありがとうございました</h1>
        <p class="lead">予約内容を登録しました。確認メールをご指定のメールアドレスに送信します。</p>
        <div class="grid-2 complete-summary">
          <div class="info-card">
            <h3>体験名</h3>
            <p class="text">香りづくり体験</p>
          </div>
          <div class="info-card">
            <h3>来店場所</h3>
            <p class="text shop-name">JapaneseAroma 香作</p>
            <dl class="shop-info">
              <div>
                <dt>住所</dt>
                <dd>東京都台東区浅草１</dd>
              </div>
              <div>
                <dt>電話</dt>
                <dd><a href="tel:03-000-0000">03-000-0000</a></dd>
              </div>
            </dl>
            <div class="shop-map">
              <iframe title="JapaneseAroma 香作の地図"
                src="https://maps.google.com/maps?q=%E6%9D%B1%E4%BA%AC%E9%83%BD%E5%8F%B0%E6%9D%B1%E5%8C%BA%E6%B5%85%E8%8D%89%EF%BC%91&output=embed"
                loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
          </div>
        </div>
        <div class="notice notice--left-spaced">予約当日は、受付でお名前をお伝えください。英語案内も可能です。</div>
        <div class="actions actions--center">
          <a class="btn" href="index.html">トップへ戻る</a>
          <a class="btn secondary" href="concept.html">コンセプトを見る</a>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="container footer-grid">
      <div><strong>Complete</strong></div>
      <div><a href="index.html">Top</a></div>
      <div><a href="experience.html">Experience</a></div>
    </div>
  </footer>

  <script src="js/main.js" defer></script>

</html>
